services:
  node-agent:
    image: ghcr.io/case211/remnawave-admin-node-agent:latest
    container_name: remnawave-node-agent
    restart: unless-stopped
    env_file:
      - .env
    # Host mode: позволяет выполнять скрипты и терминал на хосте.
    # Включите AGENT_HOST_MODE=true в .env для активации.
    pid: "host"
    # Сеть хоста нужна для полноты сетевых метрик: таблица соединений
    # (conntrack) своя у каждого network namespace, и из собственной сети
    # контейнера видно его пару соединений вместо хостовых тысяч.
    # ⚠️ В этом режиме host.docker.internal не резолвится — в AGENT_COLLECTOR_URL
    # указывайте внешний адрес панели или IP хоста.
    network_mode: "host"
    privileged: true
    volumes:
      - /var/log/remnanode:/var/log/remnanode:ro
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 32M
          
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m src.main' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      
    stop_grace_period: 15s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
