[pytest]
# Тесты бота пишутся без явных @pytest.mark.asyncio — как и в
# web/backend, где asyncio_mode=auto задан своим pytest.ini. Без этого
# файла корутины здесь не просто падали, а вовсе не запускались:
# pytest сообщал «async def functions are not natively supported» и
# засчитывал их в fail, из-за чего 15 тестов годами числились
# сломанными, ничего при этом не проверяя.
asyncio_mode = auto

# Только тесты бота: web/backend гоняется отдельной командой со своим
# pytest.ini. Совместный прогон даёт ложные падения — оба набора правят
# переменные окружения и делят кэш настроек.
testpaths = src/tests
